<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <div class="calculator">
        <h1>JavaScript<br><span>Age Calculator</span></h1>
        <div class="input-box">
            <input type="date" id="date">
            <button onclick="calculateAge()">Calculate</button>
        </div>
        <div id="result" style="margin-top: 20px; font-size: 20px;"></div>
    </div>
</div>

<script>
    let userInput = document.getElementById("date");
    let result = document.getElementById("result");

    // Prevent selecting future dates (use local date, not UTC)
    let now = new Date();
    let todayStr = [
        now.getFullYear(),
        String(now.getMonth() + 1).padStart(2, "0"),
        String(now.getDate()).padStart(2, "0")
    ].join("-");
    userInput.max = todayStr;

    // Open the date picker when clicking anywhere in the input
    userInput.addEventListener("click", () => {
        if (userInput.showPicker) {
            try { userInput.showPicker(); } catch (e) {}
        }
    });

    function calculateAge() {
        if (!userInput.value) {
            result.innerHTML = "Please select a valid date.";
            return;
        }

        // Parse as a local date so the day doesn't shift with the time zone
        let [by, bm, bd] = userInput.value.split("-").map(Number);
        let birthDate = new Date(by, bm - 1, bd);
        let today = new Date();
        today.setHours(0, 0, 0, 0);

        if (isNaN(birthDate.getTime())) {
            result.innerHTML = "Please select a valid date.";
            return;
        }

        if (birthDate > today) {
            result.innerHTML = "Birth date cannot be in the future.";
            return;
        }

        let d1 = birthDate.getDate();
        let m1 = birthDate.getMonth() + 1;
        let y1 = birthDate.getFullYear();

        let d2 = today.getDate();
        let m2 = today.getMonth() + 1;
        let y2 = today.getFullYear();

        // Whole months completed since birth
        let totalMonths = (y2 - y1) * 12 + (m2 - m1);
        if (d2 < d1) {
            totalMonths--;
        }

        let y3 = Math.floor(totalMonths / 12);
        let m3 = totalMonths % 12;

        // Date of the last "month-birthday", clamped to the end of short months
        let anchorYear = y1 + Math.floor((m1 - 1 + totalMonths) / 12);
        let anchorMonth = (m1 - 1 + totalMonths) % 12 + 1;
        let anchorDay = Math.min(d1, getDaysInMonth(anchorYear, anchorMonth));

        // Days since then (UTC avoids daylight-saving shifts)
        let d3 = Math.round(
            (Date.UTC(y2, m2 - 1, d2) - Date.UTC(anchorYear, anchorMonth - 1, anchorDay)) / 86400000
        );

        result.innerHTML = `You are <strong>${y3}</strong> years, <strong>${m3}</strong> months, and <strong>${d3}</strong> days old.`;
    }

    function getDaysInMonth(year, month) {
        return new Date(year, month, 0).getDate();
    }
</script>
</body>
</html>
